org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Gradle 8.11.1 predates Java 25 and its JavaVersion enum cannot parse "25.0.3",
# so a JAVA_HOME pointing at Corretto 25 fails every invocation during *settings*
# loading -- before any project is configured, which is why the only output is a
# bare "IllegalArgumentException: 25.0.3" with no task and no stack worth reading.
# Android Studio's bundled JBR is 21 and is what AGP expects anyway.
#
# So point Gradle at a JDK 21 in ~/.gradle/gradle.properties, not here:
#   org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
# A machine path in this file broke every CI run -- the Linux runner has no
# such directory and Gradle refuses an invalid java.home outright.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The name shown under the launcher icon, compiled into R.string.app_name by
# app/build.gradle.kts. Vessel is a working name: change this and the
# applicationId together to rename the product.
PRODUCT_NAME=Vessel
