org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Gradle 8.11.1 predates Java 25 and its JavaVersion enum cannot parse "25.0.3",
# so a JAVA_HOME pointing at Corretto 25 fails every invocation during *settings*
# loading -- before any project is configured, which is why the only output is a
# bare "IllegalArgumentException: 25.0.3" with no task and no stack worth reading.
# Android Studio's bundled JBR is 21 and is what AGP expects anyway. Override with
# -Dorg.gradle.java.home=... or delete this line once Gradle is on 8.14+.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The name shown under the launcher icon, compiled into R.string.app_name by
# app/build.gradle.kts. Vessel is a working name: change this and the
# applicationId together to rename the product.
PRODUCT_NAME=Vessel
