# Reusable component build.
#
# Every component workflow is a thin caller of this one. The design goal is
# that pushing a version bump in native/pins.env builds exactly that component
# and nothing else — CI cost should scale with what changed, not with the
# number of components.

name: component

on:
  workflow_call:
    inputs:
      component:
        description: Component name, matching build/<component>.sh
        required: true
        type: string
      ref_var:
        description: The pins.env key that versions this component
        required: true
        type: string
      source:
        # The *source tree* the component is built from, which is not always
        # its own name: turnip and zink are both built out of mesa, and
        # patches/ is keyed on the source. Defaults to the component name,
        # which is right for every component that owns its tree.
        description: Source tree name, for locating patches/<source>/
        required: false
        default: ''
        type: string
      publish:
        description: Attach the built package to the components release
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # **`contents: write` is granted by each caller, not here.** The repository
    # default is `read` (`actions/permissions/workflow`), so the publish step
    # ended every successful build with
    #     HTTP 403: Resource not accessible by integration
    #       https://api.github.com/repos/<owner>/Vessel/releases
    # after the .wcp was already built and uploaded as a run artifact -- which
    # is why no `components` release has ever existed and every .wcp that
    # reached a device came out of a run artifact by hand.
    #
    # Declaring the grant *here* does not work and is not a style preference: a
    # called workflow cannot hold more than the calling job passes it, and this
    # file asking for write while its callers held read made every caller fail
    # with `startup_failure` before a step ran. The grant therefore lives in
    # turnip.yml, wine.yml, dxvk.yml, vkd3d.yml, fex.yml and zink.yml.

    # **Serialised on the release, not on the component.** Two components
    # finishing at once both rebuild `contents.json` from what is on the release
    # at that moment, and the loser would publish an index missing the winner's
    # package. `cancel-in-progress` is false because a cancelled build has
    # already uploaded its `.wcp` and would leave the index not naming it.
    concurrency:
      group: components-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A path filter can only see that pins.env changed, not which key. This
      # checks the actual value so an unrelated bump does not rebuild
      # everything. Manual runs always build.
      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          key='${{ inputs.ref_var }}'
          now=$(grep -E "^${key}=" native/pins.env || true)
          before=$(git show HEAD~1:native/pins.env 2>/dev/null | grep -E "^${key}=" || true)
          # Keyed on the *source*, not the component. These were the same
          # string until turnip and zink -- both built from mesa -- looked for
          # patches/turnip/ and patches/zink/, neither of which has ever
          # existed. The check found nothing, always, so the gate fell through
          # to the ref comparison, and a mesa patch reached a build only when
          # MESA_REF happened to move in the same commit. turnip.yml already
          # carried a comment saying exactly this about its path filter; the
          # filter was fixed and this, one layer down, was not.
          # Not named `source`: that is a shell builtin, and quoting keeps an
          # empty default from turning the assignment into a syntax error.
          patch_dir='${{ inputs.source }}'
          patch_dir="${patch_dir:-${{ inputs.component }}}"
          patches_changed=$(git diff --name-only HEAD~1 HEAD -- "patches/${patch_dir}/" | wc -l)

          # A revision bump is a rebuild request. vessel_version_code() folds
          # it into the package version and ComponentStore only adopts a build
          # whose code is higher, so bumping the revision without producing a
          # package leaves the device on the old one with nothing to say that
          # anything was meant to change.
          rev_key=$(echo "${{ inputs.component }}" | tr "a-z" "A-Z")_REVISION
          rev_now=$(grep -E "^${rev_key}=" native/pins.env || true)
          rev_before=$(git show HEAD~1:native/pins.env 2>/dev/null | grep -E "^${rev_key}=" || true)

          if [ "$now" != "$before" ] || [ "$patches_changed" -gt 0 ] || [ "$rev_now" != "$rev_before" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.component }} unchanged; skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build toolchain image
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vessel-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ${{ inputs.component }}
        if: steps.decide.outputs.build == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/vessel-work:/work \
            vessel-build:latest "./build/${{ inputs.component }}.sh"

      - name: Show what was produced
        if: steps.decide.outputs.build == 'true'
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.build == 'true'
        with:
          name: ${{ inputs.component }}-wcp
          path: |
            dist/*.wcp
            dist/*.wcp.sha256
          if-no-files-found: error

      # Components are published to a single rolling release rather than
      # per-component tags, so the registry URL stays stable.
      - name: Publish to components release
        if: steps.decide.outputs.build == 'true' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view components >/dev/null 2>&1 \
            || gh release create components --title "Components" \
                 --notes "Rolling release of built .wcp component packages." --latest=false
          gh release upload components dist/*.wcp dist/*.wcp.sha256 --clobber

      # **The index the app reads, and the source offer the licence requires.**
      #
      # Both are generated from the release's own contents rather than from
      # `dist/`, because a component build produces one package and the release
      # holds all of them. Nothing published `contents.json` before this, so the
      # app's catalogue fetch was a 404 by construction — the downloader was
      # written, tested and unreachable. And the release body said nothing about
      # where the source of the binaries on it lives, which LGPL 2.1 section
      # 6(a) asks for; see `docs/LICENSING.md`.
      #
      # Downloading every `.wcp` to do it is ~150 MB and about twenty seconds on
      # a runner, against GitHub's own CDN. The alternative — a per-package
      # sidecar so the index can be built without the archives — is a second
      # format to keep in step with the first, and the twenty seconds only
      # happen on a main push that actually built something.
      - name: Publish the component index and the source offer
        if: steps.decide.outputs.build == 'true' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          gh release download components --dir "$work" --pattern '*.wcp' --clobber
          gh release download components --dir "$work" --pattern '*.wcp.sha256' --clobber

          python3 build/gen_registry.py \
            --dist "$work" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/components" \
            --out "$work/contents.json"
          gh release upload components "$work/contents.json" --clobber

          python3 build/source_offer.py \
            --dist "$work" \
            --repo "${{ github.repository }}" \
            --out "$work/release-notes.md"
          gh release edit components --notes-file "$work/release-notes.md"
