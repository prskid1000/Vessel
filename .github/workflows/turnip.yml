name: turnip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/pins.env
      - patches/turnip/**
      - build/turnip.sh
      - build/common.sh
      - build/package_wcp.py
      - build/targets/**
      - Dockerfile

jobs:
  build:
    uses: ./.github/workflows/_component.yml
    with:
      component: turnip
      ref_var: MESA_REF
