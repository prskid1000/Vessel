name: turnip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/pins.env
      # patches/mesa/**, not patches/turnip/** — there is no patches/turnip and
      # never has been. build/turnip.sh sets SOURCE_NAME=mesa and applies
      # patches/mesa/*.patch, because native/ and patches/ are keyed on the
      # source tree and the package on the driver built out of it. zink.yml,
      # which builds from the same checkout, already had this right. The filter
      # that was here matched nothing, so eight mesa patches only ever reached a
      # Turnip build when native/pins.env or build/turnip.sh happened to change
      # in the same commit — and patches/mesa/0008 did not, so it never built.
      - patches/mesa/**
      - build/turnip.sh
      - build/common.sh
      - build/package_wcp.py
      - build/targets/**
      - Dockerfile

jobs:
  build:
    # `_component.yml` publishes the built .wcp to the `components` release, and
    # the repository default workflow permission is `read`. A called workflow
    # cannot hold more than its caller passes it, so the grant has to be here.
    permissions:
      contents: write

    uses: ./.github/workflows/_component.yml
    with:
      component: turnip
      # Built out of mesa, so its patches live in patches/mesa/.
      source: mesa
      ref_var: MESA_REF
