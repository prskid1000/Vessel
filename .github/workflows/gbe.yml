name: gbe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/pins.env
      - patches/gbe/**
      - build/gbe.sh
      - build/common.sh
      - build/package_wcp.py
      - build/targets/**
      - Dockerfile

jobs:
  build:
    # `_component.yml` publishes the built .wcp to the `components` release, and
    # the repository default workflow permission is `read`. A called workflow
    # cannot hold more than its caller passes it, so the grant has to be here.
    permissions:
      contents: write

    uses: ./.github/workflows/_component.yml
    with:
      component: gbe
      ref_var: GBE_COMMIT
      # Microsoft's CRT and SDK, which build/gbe.sh downloads into the work
      # volume on first use (~700 MB); cached across runs by their pins.
      cache_xwin: true
