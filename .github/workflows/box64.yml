name: box64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/pins.env
      - patches/box64/**
      - build/box64.sh
      - build/common.sh
      - build/package_wcp.py
      - build/targets/**
      - Dockerfile

jobs:
  build:
    uses: ./.github/workflows/_component.yml
    with:
      component: box64
      ref_var: BOX64_REF
