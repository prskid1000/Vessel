name: zink

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/pins.env
      - patches/mesa/**
      - patches/mesa-zink/**
      - build/zink.sh
      - build/common.sh
      - build/package_wcp.py
      - build/targets/**
      - Dockerfile

jobs:
  build:
    # `_component.yml` publishes the built .wcp to the `components` release, and
    # the repository default workflow permission is `read`. A called workflow
    # cannot hold more than its caller passes it, so the grant has to be here.
    permissions:
      contents: write

    uses: ./.github/workflows/_component.yml
    with:
      component: zink
      # Built out of mesa, so its patches live in patches/mesa/.
      source: mesa
      # Zink shares the Turnip checkout, so MESA_REF is what versions it.
      # If ZINK_MESA_REF is ever set in pins.env, change this to match — the
      # reusable workflow only rebuilds when the named key actually moves.
      ref_var: MESA_REF
