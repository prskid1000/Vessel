name: app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - gradle/**
      - "*.gradle.kts"
      - gradle.properties
  pull_request:
    paths:
      - app/**

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:assembleSideloadDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vessel-sideload-debug
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
