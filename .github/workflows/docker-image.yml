# Publish the toolchain image to Docker Hub, so a first build is a `docker pull`
# rather than an hour of `docker build`:
#
#   docker pull prskid10000/vessel-build:latest
#   docker tag prskid10000/vessel-build:latest vessel-build
#
# Built from the same Dockerfile every component workflow builds, on every
# change to it, and tagged both `latest` and with the commit it came from, so an
# old component build can be reproduced against the image it was built with.
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token with write access). Without them the job says so and skips
# the push, rather than failing every Dockerfile change.
#
# The image holds only toolchains whose licenses allow redistribution. In
# particular it carries xwin but not the Microsoft CRT/SDK xwin downloads:
# build/gbe.sh fetches those on first use (see the Dockerfile).

name: docker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/vessel-build

    steps:
      - name: Check for Docker Hub credentials
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; the image is not published"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.ok == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Vessel's reproducible build environment (Android NDK, llvm-mingw, xwin)
          cache-from: type=gha
          cache-to: type=gha,mode=max
